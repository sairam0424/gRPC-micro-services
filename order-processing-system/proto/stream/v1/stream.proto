syntax = "proto3";

package stream.v1;

option go_package = "github.com/sairam0424/order-processing-system/pkg/generated/stream/v1;streampb";

message SubscribeOrderUpdatesRequest {
    string customer_id = 1;
}

message OrderItem {
    string product_id = 1;
    int32 quantity = 2;
    double price = 3;
}

message OrderStatusUpdate {
    string order_id = 1;
    string customer_id = 2;
    string status = 3;
    string message = 4;
    repeated OrderItem items = 5;
}

service StreamService {
    // SubscribeOrderUpdates provides a server-streaming gRPC endpoint for live order updates
    rpc SubscribeOrderUpdates(SubscribeOrderUpdatesRequest) returns (stream OrderStatusUpdate);
}
