syntax = "proto3";

package order.v1;

option go_package = "github.com/sairamugge/order-processing/order/v1;orderv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Order Processing Service"
    version: "1.0"
    description: "Industry-standard Order Management API powered by gRPC-Gateway and Go."
    contact: {
      name: "Sairam Ugge"
      url: "https://github.com/sairam0424"
    }
  }
  schemes: HTTP
  consumes: "application/json"
  produces: "application/json"
};

// OrderService handles all order-related operations.
service OrderService {
  // CreateOrder creates a new order in the system.
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders"
      body: "*"
    };
  }
  
  // GetOrder retrieves an order by its unique identifier.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {
      get: "/v1/orders/{order_id}"
    };
  }
  
  // ListOrders returns a list of orders for a specific customer.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/orders"
    };
  }
}

// OrderStatus defines the various states of an order.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PROCESSING = 2;
  ORDER_STATUS_COMPLETED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

// CreateOrderRequest is the request message for creating a new order.
message CreateOrderRequest {
  string customer_id = 1;
  repeated OrderItem items = 2;
}

// CreateOrderResponse is the response message after order creation.
message CreateOrderResponse {
  string order_id = 1;
  OrderStatus status = 2;
}

// GetOrderRequest is the request message for retrieving an order.
message GetOrderRequest {
  string order_id = 1;
}

// GetOrderResponse is the detailed response for an order retrieval.
message GetOrderResponse {
  string order_id = 1;
  string customer_id = 2;
  repeated OrderItem items = 3;
  OrderStatus status = 4;
}

// ListOrdersRequest is the request message for listing orders of a customer.
message ListOrdersRequest {
  string customer_id = 1;
}

// ListOrdersResponse contains the list of orders for the customer.
message ListOrdersResponse {
  repeated GetOrderResponse orders = 1;
}

// OrderItem represents a single product item in an order.
message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  double price = 3;
}
