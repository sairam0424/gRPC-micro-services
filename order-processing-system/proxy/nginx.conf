worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile        on;
    keepalive_timeout  65;



    server {
        listen 80;
        server_name localhost;

        # DNS resolver for Docker
        resolver 127.0.0.11 valid=30s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Service Variables (forced resolution)
        set $auth_backend "http://auth-service:8002";
        set $gateway_backend "http://envoy:80";
        set $web_backend "http://web-client:3000";
        set $inventory_backend "http://inventory-service:8001";
        set $order_health "http://order-service:8081";
        set $streamer_health "http://order-streamer:8082";

        location ^~ /api/auth/ {
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass $auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/inventory/ {
            rewrite ^/api/inventory/(.*)$ /$1 break;
            proxy_pass $inventory_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/orders/health {
            rewrite ^/api/orders/health$ /health break;
            proxy_pass $order_health;
        }

        location /api/streamer/health {
            rewrite ^/api/streamer/health$ /health break;
            proxy_pass $streamer_health;
        }

        location /api/orders/events {
            rewrite ^/api/orders/events$ /orders/events break;
            proxy_pass $gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            
            # Disable buffering for SSE
            proxy_set_header X-Accel-Buffering no;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS (Adjust as needed for production)
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT';
            add_header 'Access-Control-Allow-Headers' 'X-Requested-With,Content-Type,Authorization';
        }

        location / {
            proxy_pass $web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Error pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
