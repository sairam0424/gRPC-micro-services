
services:
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./order-service:/app
    ports:
      - "50051:50051"
    environment:
      - INVENTORY_SERVICE_ADDR=inventory-service:50052
      - KAFKA_BROKERS=kafka:29092
      - DATABASE_URL=${ORDER_DATABASE_URL}
    # Overriding CMD to use air for hot-reloading
    command: sh -c "go install github.com/air-verse/air@v1.61.1 && air -c .air.toml"
    networks:
      - grpc-net
    depends_on:
      - inventory-service
    develop:
      watch:
        - path: ./order-service
          target: /app
          action: sync

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    volumes:
      - ./api-gateway/src:/app/src
    environment:
      - ORDER_SERVICE_ADDR=order-service:50051
      - STREAM_SERVICE_ADDR=order-streamer:50053
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key}
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - order-service
      - order-streamer
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./api-gateway/src
          target: /app/src
          action: sync

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=${ORDER_DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key}
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8002 --reload
    depends_on:
      - kafka
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./auth-service/src
          target: /app/src
          action: sync
        - path: ./auth-service/pyproject.toml
          action: rebuild

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    volumes:
      - ./inventory-service/src:/app/src
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    # Use uvicorn with reload for the FastAPI part, gRPC will restart when uvicorn reloads the module
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - kafka
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./inventory-service/src
          target: /app/src
          action: sync

  order-streamer:
    build:
      context: ./order-streamer
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./order-streamer:/app
    environment:
      - KAFKA_BROKERS=kafka:29092
    command: sh -c "go install github.com/air-verse/air@v1.61.1 && air -c .air.toml"
    depends_on:
      - kafka
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./order-streamer
          target: /app
          action: sync


  web-client:
    build:
      context: ./web-client
    volumes:
      - ./web-client:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - api-gateway
      - inventory-service
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./web-client
          target: /app
          ignore:
            - node_modules
            - .next
          action: sync
        - path: ./web-client/package.json
          action: rebuild

  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - web-client
    networks:
      - grpc-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    command: /etc/confluent/docker/run
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    command: /etc/confluent/docker/run
    depends_on:
      - zookeeper
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  grpc-net:
    driver: bridge

volumes:
  inventory-data:
