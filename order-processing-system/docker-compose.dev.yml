
services:
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./order-service:/app
      - go-cache:/go/pkg/mod
      - go-cache:/root/.cache/go-build
    ports:
      - "50051:50051"
    environment:
      - INVENTORY_SERVICE_ADDR=inventory-service:50052
      - KAFKA_BROKERS=kafka:29092
      - DATABASE_URL=${ORDER_DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    command: sh -c "air -c .air.toml"
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    develop:
      watch:
        - path: ./order-service
          target: /app
          action: sync

  api-gateway-1:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8101:8000"
    volumes:
      - ./api-gateway/src:/app/src
    environment:
      - ORDER_SERVICE_ADDR=order-service:50051
      - INVENTORY_SERVICE_ADDR=inventory-service:50052
      - STREAM_SERVICE_ADDR=order-streamer:50053
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      order-service:
        condition: service_healthy
      order-streamer:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./api-gateway/src
          target: /app/src
          action: sync

  api-gateway-2:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8102:8000"
    volumes:
      - ./api-gateway/src:/app/src
    environment:
      - ORDER_SERVICE_ADDR=order-service:50051
      - INVENTORY_SERVICE_ADDR=inventory-service:50052
      - STREAM_SERVICE_ADDR=order-streamer:50053
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      order-service:
        condition: service_healthy
      order-streamer:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./api-gateway/src
          target: /app/src
          action: sync

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8002:8002"
    volumes:
      - ./auth-service/src:/app/src
    environment:
      - DATABASE_URL=${ORDER_DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./auth-service/src
          target: /app/src
          action: sync
        - path: ./auth-service/pyproject.toml
          action: rebuild

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./inventory-service/src:/app/src
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REPLICA_DATABASE_URL=${REPLICA_DATABASE_URL}
      - REPLICA2_DATABASE_URL=${REPLICA2_DATABASE_URL}
      - ETCD_HOST=${ETCD_HOST}
      - ETCD_PORT=${ETCD_PORT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    # Use uvicorn with reload for the FastAPI part, gRPC will restart when uvicorn reloads the module
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./inventory-service/src
          target: /app/src
          action: sync

  connect:
    image: debezium/connect:2.5
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_INTERNAL_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_INTERNAL_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_CONFIG_PROVIDERS=env
      - CONNECT_CONFIG_PROVIDERS_ENV_CLASS=org.apache.kafka.common.config.provider.EnvVarConfigProvider
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - grpc-net

  order-streamer:
    build:
      context: ./order-streamer
      dockerfile: Dockerfile
      target: builder
    ports:
      - "50053:50053"
    volumes:
      - ./order-streamer:/app
      - go-cache:/go/pkg/mod
      - go-cache:/root/.cache/go-build
    environment:
      - KAFKA_BROKERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    command: sh -c "air -c .air.toml"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./order-streamer
          target: /app
          action: sync


  web-client:
    build:
      context: ./web-client
    ports:
      - "3001:3000"
    volumes:
      - ./web-client:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      envoy:
        condition: service_started
      inventory-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./web-client
          target: /app
          ignore:
            - node_modules
            - .next
          action: sync
        - path: ./web-client/package.json
          action: rebuild

  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "8010:80" # Temporary port for Nginx if Envoy is on 80
    depends_on:
      - envoy
      - web-client
    networks:
      - grpc-net

  envoy:
    image: envoyproxy/envoy:v1.29-latest
    ports:
      - "8085:80"   # Envoy Proxy ingress (redirected from 80 which Nginx uses)
      - "9901:9901" # Admin UI
    volumes:
      - ./proxy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      api-gateway-1:
        condition: service_healthy
      api-gateway-2:
        condition: service_healthy
    networks:
      - grpc-net

  jaeger:
    image: jaegertracing/jaeger:2.2.0
    ports:
      - "16686:16686" # UI
    networks:
      - grpc-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - grpc-net

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - grpc-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    networks:
      - grpc-net
    depends_on:
      - prometheus
      - loki
      - jaeger

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4319:4317" # OTLP gRPC receiver (Remapped to avoid host conflict)
      - "4320:4318" # OTLP HTTP receiver (Remapped to avoid host conflict)
      - "8889:8889" # Prometheus exporter
      - "13133:13133" # Health check
    networks:
      - grpc-net
    depends_on:
      - jaeger
      - prometheus
      - loki

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - grpc-net

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8003:8001" # Redis Insight
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
      - RI_STDOUT_LOGGER=true
      - RI_APP_HOST=0.0.0.0
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - grpc-net

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - "8082:8081" # Map to 8082 as 8081 is used by order-service health in some configs? Wait, order-service health is usually different. 
      # Let's use 8084 for Redis Commander to be safe.
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - grpc-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-1
      - --enable-v2=true
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  haproxy:
    image: haproxy:2.8
    volumes:
      - ./proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5438:5432"
      - "5439:5433"
      - "5440:5434"
      - "8405:8404"
    networks:
      - grpc-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:6432"
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - grpc-net

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_LICENSE: ${MINIO_LICENSE}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 1s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  flink-jobmanager:
    image: flink:1.18.1-java11
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: s3://flink-checkpoints/checkpoints
        state.savepoints.dir: s3://flink-checkpoints/savepoints
        s3.endpoint: ${MINIO_ENDPOINT}
        s3.access-key: ${MINIO_ROOT_USER}
        s3.secret-key: ${MINIO_ROOT_PASSWORD}
        s3.path.style.access: true
    depends_on:
      - minio
    networks:
      - grpc-net

  flink-taskmanager:
    image: flink:1.18.1-java11
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.backend: rocksdb
        state.checkpoints.dir: s3://flink-checkpoints/checkpoints
        state.savepoints.dir: s3://flink-checkpoints/savepoints
        s3.endpoint: ${MINIO_ENDPOINT}
        s3.access-key: ${MINIO_ROOT_USER}
        s3.secret-key: ${MINIO_ROOT_PASSWORD}
        s3.path.style.access: true
    depends_on:
      - flink-jobmanager
    networks:
      - grpc-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticvue:
    image: cars10/elasticvue:latest
    ports:
      - "8084:8080" # Using 8084 to avoid potential conflicts
    networks:
      - grpc-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/flink-checkpoints --ignore-existing;
      mc mb local/ml-models --ignore-existing;
      mc mb local/feature-store --ignore-existing;
      mc mb local/raw-events --ignore-existing;
      mc admin user add local $${FLINK_S3_ACCESS_KEY} $${FLINK_S3_SECRET_KEY} || true;
      mc admin policy attach local readwrite --user $${FLINK_S3_ACCESS_KEY} || true;
      case \"$${MINIO_LICENSE}\" in
        *MTE5MTE5*|\"\")
          echo \"Skipping MinIO license registration (placeholder or empty license detected)\"
          ;;
        *)
          echo \"$${MINIO_LICENSE}\" > /tmp/minio.license;
          mc license register local --license /tmp/minio.license || true
          ;;
      esac;
      exit 0;
      "
    networks:
      - grpc-net

  analytics-pipeline:
    build:
      context: ./analytics-pipeline
      dockerfile: Dockerfile
    volumes:
      - ./analytics-pipeline/src:/app/src
    environment:
      - KAFKA_BROKERS=kafka:29092
      - FLINK_JOBMANAGER_HOST=flink-jobmanager
      - CLICKHOUSE_HOST=clickhouse
      - ELASTICSEARCH_HOST=elasticsearch
      - S3_ENDPOINT=${MINIO_ENDPOINT}
      - S3_ACCESS_KEY=${FLINK_S3_ACCESS_KEY}
      - S3_SECRET_KEY=${FLINK_S3_SECRET_KEY}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - CLICKHOUSE_CLOUD_HOST=${CLICKHOUSE_CLOUD_HOST}
      - CLICKHOUSE_CLOUD_PORT=${CLICKHOUSE_CLOUD_PORT}
      - CLICKHOUSE_CLOUD_USER=${CLICKHOUSE_CLOUD_USER}
      - CLICKHOUSE_CLOUD_PASSWORD=${CLICKHOUSE_CLOUD_PASSWORD}
      - ELASTICSEARCH_CLOUD_ENDPOINT=${ELASTICSEARCH_CLOUD_ENDPOINT}
      - ELASTICSEARCH_CLOUD_API_KEY=${ELASTICSEARCH_CLOUD_API_KEY}
      - AWS_ACCESS_KEY_ID=${FLINK_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${FLINK_S3_SECRET_KEY}
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pgrep python > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    depends_on:
      - kafka
      - flink-jobmanager
      - clickhouse
      - minio-setup
      - elasticsearch
      - minio
    networks:
      - grpc-net

  replay-service:
    build:
      context: ./infra/replay-service
    ports:
      - "8087:8000"
    environment:
      - KAFKA_BROKERS=kafka:29092
      - PORT=8000
    depends_on:
      - kafka
    networks:
      - grpc-net

  dlq-ui:
    build:
      context: ./infra/dlq-ui
    ports:
      - "8086:8000"
    environment:
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - grpc-net

networks:
  grpc-net:
    driver: bridge

volumes:
  inventory-data:
  etcd-data:
  minio-data:
  clickhouse-data:
  elasticsearch-data:
  go-cache:
