
services:
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./order-service:/app
    ports:
      - "50051:50051"
    environment:
      - INVENTORY_SERVICE_ADDR=inventory-service:50052
      - KAFKA_BROKERS=kafka:29092
      - DATABASE_URL=${ORDER_DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    # Overriding CMD to use air for hot-reloading
    command: sh -c "go install github.com/air-verse/air@v1.61.1 && air -c .air.toml"
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    develop:
      watch:
        - path: ./order-service
          target: /app
          action: sync

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8100:8000"
    volumes:
      - ./api-gateway/src:/app/src
    environment:
      - ORDER_SERVICE_ADDR=order-service:50051
      - INVENTORY_SERVICE_ADDR=inventory-service:50052
      - STREAM_SERVICE_ADDR=order-streamer:50053
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - REDIS_PASSWORD=bloompass
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      order-service:
        condition: service_healthy
      order-streamer:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./api-gateway/src
          target: /app/src
          action: sync

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8002:8002"
    volumes:
      - ./auth-service/src:/app/src
    environment:
      - DATABASE_URL=${ORDER_DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./auth-service/src
          target: /app/src
          action: sync
        - path: ./auth-service/pyproject.toml
          action: rebuild

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    volumes:
      - ./inventory-service/src:/app/src
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - REDIS_PASSWORD=bloompass
    # Use uvicorn with reload for the FastAPI part, gRPC will restart when uvicorn reloads the module
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./inventory-service/src
          target: /app/src
          action: sync

  order-streamer:
    build:
      context: ./order-streamer
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./order-streamer:/app
    environment:
      - KAFKA_BROKERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    command: sh -c "go install github.com/air-verse/air@v1.61.1 && air -c .air.toml"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./order-streamer
          target: /app
          action: sync


  web-client:
    build:
      context: ./web-client
    volumes:
      - ./web-client:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      api-gateway:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - grpc-net
    develop:
      watch:
        - path: ./web-client
          target: /app
          ignore:
            - node_modules
            - .next
          action: sync
        - path: ./web-client/package.json
          action: rebuild

  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - web-client
    networks:
      - grpc-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
    networks:
      - grpc-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - grpc-net

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - grpc-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    networks:
      - grpc-net
    depends_on:
      - prometheus
      - loki
      - jaeger

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus exporter
      - "13133:13133" # Health check
    networks:
      - grpc-net
    depends_on:
      - jaeger
      - prometheus
      - loki

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    command: /etc/confluent/docker/run
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    command: /etc/confluent/docker/run
    depends_on:
      - zookeeper
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - grpc-net
    healthcheck:
      # Use kafka-broker-api-versions to check if the broker is up on the internal port
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - grpc-net

  redis:
    image: redis/redis-stack:latest
    platform: linux/arm64
    ports:
      - "6379:6379"
      - "8003:8001" # Redis Insight
    environment:
      - REDIS_ARGS=--requirepass bloompass --maxmemory 256mb --maxmemory-policy allkeys-lru
      - RI_STDOUT_LOGGER=true
      - RI_APP_HOST=0.0.0.0
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:latest
    platform: linux/arm64
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=bloompass
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - grpc-net

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    platform: linux/arm64
    environment:
      - REDIS_HOSTS=local:redis:6379:0:bloompass
    ports:
      - "8082:8081" # Map to 8082 as 8081 is used by order-service health in some configs? Wait, order-service health is usually different. 
      # Let's use 8084 for Redis Commander to be safe.
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - grpc-net


networks:
  grpc-net:
    driver: bridge

volumes:
  inventory-data:
