services:
  # Coordination & Governance
  saga-orchestrator:
    build:
      context: .
      dockerfile: saga-orchestrator/Dockerfile
    ports:
      - "50054:50054"
    environment:
      - KAFKA_BROKERS=kafka:29092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network
      - public-data-network # Needs to talk to Kafka/Redis in Data Plane

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network
      - public-data-network # Needs Kafka

  connect:
    image: debezium/connect:2.5
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_INTERNAL_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_INTERNAL_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_CONFIG_PROVIDERS=env
      - CONNECT_CONFIG_PROVIDERS_ENV_CLASS=org.apache.kafka.common.config.provider.EnvVarConfigProvider
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - internal-control-network
      - public-data-network # Needs Kafka

  replay-service:
    build:
      context: ./infra/replay-service
    ports:
      - "8087:8000"
    environment:
      - KAFKA_BROKERS=kafka:29092
      - PORT=8000
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network
      - public-data-network # Needs Kafka

  dlq-ui:
    build:
      context: ./infra/dlq-ui
    ports:
      - "8086:8000"
    environment:
      - KAFKA_BROKERS=kafka:29092
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network
      - public-data-network # Needs Kafka

  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-1
      - --enable-v2=true
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network

  # Monitoring & Visibility
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    networks:
      - internal-control-network
      - public-data-network # To scrape data plane services

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    networks:
      - internal-control-network

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network

  jaeger:
    image: jaegertracing/jaeger:2.2.0
    ports:
      - "16686:16686"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4319:4317"
      - "4320:4318"
      - "8889:8889"
      - "13133:13133"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network
      - public-data-network # To receive from data plane services

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network
      - public-data-network # Needs Kafka/Zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network
      - public-data-network # Kafka in Data Plane needs Zookeeper

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    networks:
      - internal-control-network
      - public-data-network # Scrapes Redis

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - "8082:8081"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network
      - public-data-network # Manages Redis

  elasticvue:
    image: cars10/elasticvue:latest
    ports:
      - "8084:8080"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-control-network
      - public-data-network # Manages Elasticsearch

networks:
  internal-control-network:
    external: true
  public-data-network:
    external: true

volumes:
  etcd-data:
    external: true
