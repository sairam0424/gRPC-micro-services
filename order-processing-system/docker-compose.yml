
services:
  order-service:
    build:
      context: ./order-service
    ports:
      - "50051:50051"
    networks:
      - grpc-net

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      - ORDER_SERVICE_ADDR=order-service:50051
    depends_on:
      - order-service
    networks:
      - grpc-net

  web-client:
    build:
      context: ./web-client
    depends_on:
      - api-gateway
    networks:
      - grpc-net

  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - web-client
    networks:
      - grpc-net

networks:
  grpc-net:
    driver: bridge
