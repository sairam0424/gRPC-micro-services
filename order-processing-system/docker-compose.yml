
services:
  order-service:
    build:
      context: ./order-service
    ports:
      - "50051:50051"
    environment:
      - INVENTORY_SERVICE_ADDR=inventory-service:50052
      - DATABASE_URL=${ORDER_DATABASE_URL}
      - KAFKA_BROKERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    networks:
      - grpc-net
    depends_on:
      - inventory-service
      - kafka
      - otel-collector

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      - ORDER_SERVICE_ADDR=order-service:50051
      - STREAM_SERVICE_ADDR=order-streamer:50053
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    depends_on:
      - order-service
      - order-streamer
      - auth-service
      - otel-collector
    networks:
      - grpc-net

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=${ORDER_DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - kafka
      - otel-collector
    networks:
      - grpc-net

  inventory-service:
    build:
      context: ./inventory-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - grpc-net
    depends_on:
      - otel-collector
      - redis

  order-streamer:
    build:
      context: ./order-streamer
    environment:
      - KAFKA_BROKERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    depends_on:
      - kafka
      - otel-collector
    networks:
      - grpc-net

  web-client:
    build:
      context: ./web-client
    depends_on:
      - api-gateway
      - inventory-service
    networks:
      - grpc-net

  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - web-client
    networks:
      - grpc-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
    networks:
      - grpc-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - grpc-net

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - grpc-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    networks:
      - grpc-net
    depends_on:
      - prometheus
      - loki
      - jaeger

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317" # OTLP gRPC receiver
      - "4318" # OTLP HTTP receiver
      - "8889" # Prometheus exporter
    networks:
      - grpc-net
    depends_on:
      - jaeger
      - prometheus
      - loki

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - grpc-net

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - grpc-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - grpc-net

  redis:
    image: redis/redis-stack:latest
    platform: linux/arm64
    ports:
      - "6379:6379"
      - "8003:8001" # Redis Insight
    environment:
      - REDIS_ARGS=--requirepass bloompass --maxmemory 256mb --maxmemory-policy allkeys-lru
      - RI_STDOUT_LOGGER=true
      - RI_APP_HOST=0.0.0.0
    networks:
      - grpc-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:latest
    platform: linux/arm64
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=bloompass
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - grpc-net

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    platform: linux/arm64
    environment:
      - REDIS_HOSTS=local:redis:6379:0:bloompass
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - grpc-net

networks:
  grpc-net:
    driver: bridge

volumes:
  inventory-data:
