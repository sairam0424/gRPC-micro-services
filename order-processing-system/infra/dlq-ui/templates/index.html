<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafka DLQ Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.8);
            --primary: #58a6ff;
            --accent: #bc8cff;
            --error: #ff7b72;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --border: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        h1 {
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: var(--text-dim);
            backdrop-filter: blur(10px);
        }

        .tab:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        .tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
        }

        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .message-body {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .error-badge {
            color: var(--error);
            font-size: 0.75rem;
            margin-top: 0.5rem;
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-dim);
            font-style: italic;
        }

        .loader {
            display: none;
            justify-content: center;
            margin: 2rem;
        }

        .loader::after {
            content: "";
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DLQ Monitor</h1>
        
        <div class="tabs">
            {% for topic in topics %}
            <div class="tab" onclick="loadMessages('{{ topic }}', this)">{{ topic }}</div>
            {% endfor %}
        </div>

        <div id="loader" class="loader"></div>
        
        <div id="replaySection" style="display: none; margin-bottom: 2rem; text-align: center; border: 1px dashed var(--primary); padding: 1.5rem; border-radius: 12px; background: rgba(88, 166, 255, 0.05);">
            <p style="margin-top: 0; font-size: 0.9rem; color: var(--text-dim);">Found trapped messages. You can trigger a replay to the primary processing topic.</p>
            <button id="replayBtn" class="tab active" style="font-size: 0.9rem; padding: 0.5rem 2rem;">Replay All to Target</button>
            <div id="replayStatus" style="margin-top: 1rem; font-size: 0.85rem;"></div>
        </div>

        <div id="messagesList" class="messages-list">
            <div class="empty-state">Select a topic to view messages</div>
        </div>
    </div>

    <script>
        async function loadMessages(topic, el) {
            // Update UI tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            const list = document.getElementById('messagesList');
            const loader = document.getElementById('loader');
            const replaySection = document.getElementById('replaySection');
            const replayStatus = document.getElementById('replayStatus');
            const replayBtn = document.getElementById('replayBtn');
            
            list.innerHTML = '';
            loader.style.display = 'flex';
            replaySection.style.display = 'none';
            replayStatus.innerHTML = '';

            try {
                const response = await fetch(`/messages/${topic}`);
                const data = await response.json();
                
                loader.style.display = 'none';

                if (data.messages && data.messages.length > 0) {
                    replaySection.style.display = 'block';
                    replayBtn.onclick = () => triggerReplay(topic);

                    data.messages.forEach(msg => {
                        const card = document.createElement('div');
                        card.className = 'message-card';
                        
                        let content = typeof msg.content === 'object' ? JSON.stringify(msg.content, null, 2) : msg.content;
                        
                        card.innerHTML = `
                            <div class="message-header">
                                <span>Offset: ${msg.offset}</span>
                                <span>${new Date(msg.timestamp).toLocaleString()}</span>
                            </div>
                            <div class="message-body">${content}</div>
                            ${msg.error ? `<span class="error-badge">Parsing Error: ${msg.error}</span>` : ''}
                        `;
                        list.appendChild(card);
                    });
                } else {
                    list.innerHTML = '<div class="empty-state">No messages found in this topic</div>';
                }
            } catch (err) {
                loader.style.display = 'none';
                list.innerHTML = `<div class="empty-state" style="color: var(--error)">Error loading messages: ${err.message}</div>`;
            }
        }

        async function triggerReplay(topic) {
            const status = document.getElementById('replayStatus');
            const btn = document.getElementById('replayBtn');
            
            status.innerHTML = '<span style="color: var(--primary)">Triggering replay...</span>';
            btn.disabled = true;
            btn.style.opacity = '0.5';

            try {
                const response = await fetch(`/api/replay/${topic}`, { method: 'POST' });
                const result = await response.json();
                
                if (result.status === 'success') {
                    status.innerHTML = `<span style="color: #3fb950">Successfully replayed ${result.count} messages!</span>`;
                    setTimeout(() => loadMessages(topic, document.querySelector('.tab.active')), 2000);
                } else {
                    status.innerHTML = `<span style="color: var(--error)">Replay failed: ${result.message}</span>`;
                }
            } catch (err) {
                status.innerHTML = `<span style="color: var(--error)">Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
