# golangci-lint as a build-blocking CI gate. Previously this was only run as
# a CodeRabbit PR-comment review tool (.coderabbit.yaml); it never gated
# merges. Matrix mirrors go.yml's module list.
# For more information see: https://github.com/golangci/golangci-lint-action

name: golangci-lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - order-processing-system/order-service
          - order-processing-system/order-streamer
          - order-processing-system/saga-orchestrator
          - order-processing-system/infra/replay-service
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml
