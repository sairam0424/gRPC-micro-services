# ruff (lint), mypy (type-check), and pip-audit (dependency vulnerability
# scan) as CI gates, run per Python service. python-app.yml already lints
# with flake8 and tests only inventory-service; this workflow is additive
# and covers every Python service in the monorepo instead. flake8 is left
# in place (retiring it in favor of ruff is a suggested follow-up, not done
# here to keep this diff surgical).
#
# `ruff format --check` is intentionally NOT run here: this codebase has
# never been reformatted with ruff, so a repo-wide format check would fail
# on every file with zero signal. A one-time `ruff format` pass is a
# separate follow-up.

name: Python quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-processing-system/api-gateway
            manifest: pyproject
          - service: order-processing-system/auth-service
            manifest: pyproject
          - service: order-processing-system/inventory-service
            manifest: pyproject
          - service: order-processing-system/media-service
            manifest: requirements
          - service: order-processing-system/analytics-pipeline
            manifest: requirements
          - service: order-processing-system/infra/dlq-ui
            manifest: requirements
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff mypy pip-audit

      - name: Install service dependencies (pyproject)
        if: matrix.manifest == 'pyproject'
        working-directory: ${{ matrix.service }}
        run: pip install -e .

      - name: Install service dependencies (requirements.txt)
        if: matrix.manifest == 'requirements'
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements.txt

      - name: ruff check
        working-directory: ${{ matrix.service }}
        run: ruff check .

      - name: mypy
        working-directory: ${{ matrix.service }}
        run: mypy .

      - name: pip-audit
        working-directory: ${{ matrix.service }}
        run: pip-audit
