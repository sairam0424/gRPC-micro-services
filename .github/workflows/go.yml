# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This is a monorepo of independent Go modules (each with its own
        # go.mod); there is no module at the repo root, so `go build ./...`
        # / `go test ./...` must run from inside each module's directory.
        module:
          - order-processing-system/order-service
          - order-processing-system/order-streamer
          - order-processing-system/saga-orchestrator
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: 'stable'

    - name: Build
      working-directory: ${{ matrix.module }}
      run: go build -v ./...

    - name: Test
      working-directory: ${{ matrix.module }}
      run: go test -v ./...
