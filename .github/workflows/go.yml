# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This is a monorepo of independent Go modules (each with its own
        # go.mod); there is no module at the repo root, so `go build ./...`
        # / `go test ./...` must run from inside each module's directory.
        module:
          - order-processing-system/order-service
          - order-processing-system/order-streamer
          - order-processing-system/saga-orchestrator
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 'stable'

    - name: Build
      working-directory: ${{ matrix.module }}
      run: go build -v ./...

    - name: Test
      working-directory: ${{ matrix.module }}
      run: go test -v ./...
