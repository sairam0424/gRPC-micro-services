# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/order-processing-system/order-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/order-processing-system/order-streamer"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/order-processing-system/saga-orchestrator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/order-processing-system/infra/replay-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/order-processing-system/analytics-pipeline"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/order-processing-system/media-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/order-processing-system/infra/dlq-ui"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/order-processing-system/api-gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/order-processing-system/auth-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/order-processing-system/inventory-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/order-processing-system/web-client"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
